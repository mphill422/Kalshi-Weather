name: Lows Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz
      - name: Run lows smoke test
        env:
          WETHR_API_KEY: ${{ secrets.WETHR_API_KEY }}
        run: python fetch_lows.py
