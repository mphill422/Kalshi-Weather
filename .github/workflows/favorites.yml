name: Favorites

# Scheduling is handled by cron-job.org, NOT by GitHub.
#
# GitHub's scheduled workflows were delayed by ~3 hours on this repo (observed
# 2026-09-03: crons set for 20:00 UTC fired at 23:02). That is far beyond the
# 5-20 minute queue delay the script's latch was built to absorb, so no latch
# width can fix it. Every scheduled run since deployment landed outside its
# window and logged nothing.
#
# cron-job.org fires within ~1 second of target and POSTs to this workflow's
# dispatch endpoint:
#   https://api.github.com/repos/mphill422/Kalshi-Weather/actions/workflows/favorites.yml/dispatches
#
# Three jobs, all in America/New_York so DST is handled upstream:
#   Favorites Morning    10:30
#   Favorites Midday     12:00
#   Favorites Afternoon  16:00
#
# Do NOT re-add an `on: schedule:` block here. It will fire hours late, the
# script's one-sided latch will correctly decline it, and the run list fills
# with declines that read as failures. That has already cost two debugging
# sessions.
#
# The script still checks Eastern local time through pytz and only fires inside
# a window, so a stray manual dispatch remains a harmless no-op.

on:
  workflow_dispatch:

jobs:
  favorites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_favorites.py
