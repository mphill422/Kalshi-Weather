name: Kalshi Survey
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Kalshi category to scan'
        required: true
        default: 'Financials'
        type: choice
        options:
          - Financials
          - Crypto
          - Economics
          - Climate and Weather
          - Companies
          - Politics
          - Sports
          - Health
          - World
      min_events:
        description: 'Minimum settled events in 30 days'
        required: false
        default: '20'
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          CATEGORY: ${{ inputs.category }}
          MIN_EVENTS: ${{ inputs.min_events }}
        run: python kalshi_survey.py
