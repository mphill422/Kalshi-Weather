name: Low Source Probe

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run low source probe
        env:
          WETHR_API_KEY: ${{ secrets.WETHR_API_KEY }}
        run: python low_source_probe.py
