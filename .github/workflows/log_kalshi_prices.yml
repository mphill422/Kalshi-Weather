name: Log Kalshi Prices

# Records the market side. READ-ONLY -- GET endpoints only, no order placement
# anywhere in the script.
#
# Save as .github/workflows/log_kalshi_prices.yml
# Uses the same four secrets kalshi_settlements.py already uses. Nothing new.
#
# ── WHY HOURLY AND NOT */30 ────────────────────────────────────────────────
# First attempt used '*/30 * * * *'. Over the first 21 hours GitHub honoured
# exactly ONE of ~42 scheduled fires (run #5, 2026-11-23 09:20). Scheduled
# workflows are best-effort and high-frequency crons are the first thing
# dropped under load.
#
# Hourly is what every other job in this repo already runs at successfully --
# health_monitor confirms the snapshots job hitting "10 of 10 hours" -- so the
# throttling is specific to the */30 pattern, not to this repo.
#
# If 30-minute granularity is ever genuinely needed (the repricing-lag
# question), the fix is NOT a faster cron. It is one long-running job that
# loops internally and sleeps between captures, fired a few times a day.
# Overlapping runs are harmless: the unique index on
# (market_ticker, snap_slot) makes duplicate captures no-ops.

on:
  schedule:
    - cron: '0 * * * *'       # top of every hour, UTC
  workflow_dispatch:          # manual button

concurrency:
  group: log-kalshi-prices
  cancel-in-progress: false   # never cancel a run mid-write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - name: Capture market snapshot
        env:
          KALSHI_API_KEY_ID:    ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY:   ${{ secrets.KALSHI_PRIVATE_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python log_kalshi_prices.py
