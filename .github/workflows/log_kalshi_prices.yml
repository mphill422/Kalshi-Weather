name: Log Kalshi Prices

# Records the market side. READ-ONLY -- GET endpoints only, no order placement
# anywhere in the script.
#
# Save as .github/workflows/log_kalshi_prices.yml
# Uses the same four secrets kalshi_settlements.py already uses. Nothing new.
#
# ── WHY A LOOP INSTEAD OF A FREQUENT CRON ─────────────────────────────────
# Attempt 1: '*/30 * * * *'. Over 21 hours GitHub honoured ONE of ~42 fires.
# Attempt 2: '0 * * * *'  . Over 26 hours GitHub honoured ~ONE of ~26 fires.
# Other jobs in this repo run fine, so this is GitHub deprioritising scheduled
# workflows generally -- they are best-effort and get dropped under load.
#
# So: stop depending on how OFTEN the cron fires, and depend on it firing at
# all. Each start now captures for 5h30m, taking a snapshot on every :00 and
# :30 boundary -- about 11 per start. Four starts a day, deliberately
# overlapping, so a dropped fire is covered by its neighbour.
#
# Overlap is free: the unique index on (market_ticker, snap_slot) makes a
# duplicate capture a no-op insert. Two jobs hitting the same slot write one row.
#
# Runner cost is zero -- public repos get unlimited GitHub-hosted minutes.

on:
  schedule:
    # 4 overlapping starts, covering the US trading day and then some
    - cron: '0 13,16,19,22 * * *'
  workflow_dispatch:

# NO concurrency group on purpose. Overlapping runs are the redundancy that
# makes this work, and the DB index already de-duplicates them.

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 345          # must exceed the 330-minute loop below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - name: Capture market snapshots for 5h30m
        env:
          KALSHI_API_KEY_ID:    ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY:   ${{ secrets.KALSHI_PRIVATE_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          END=$(( $(date +%s) + 19800 ))     # 5h30m from now
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            echo "::group::capture $N  $(date -u +%H:%M:%SZ)"
            # '|| true' is load-bearing: the script exits 1 when too few series
            # have live markets, which is normal overnight. One bad capture must
            # not end a 5-hour run.
            python log_kalshi_prices.py || echo "capture $N failed, continuing"
            echo "::endgroup::"
            NOW=$(date +%s)
            NEXT=$(( (NOW / 1800 + 1) * 1800 + 5 ))   # next :00 or :30, +5s
            [ "$NEXT" -ge "$END" ] && break
            echo "sleeping $(( NEXT - NOW ))s until $(date -u -d "@$NEXT" +%H:%M:%SZ)"
            sleep $(( NEXT - NOW ))
          done
          echo "done: $N captures this run"
