name: Weather Data Fetch

on:
  schedule:
    # Every 10 minutes from 9am-5pm ET (14:00-22:00 UTC)
    # Hits :00, :10, :20, :30, :40, :50 of each hour.
    # Critical: :30 cron times are required to trigger the V5.27.1 paper-bet
    # windows at 14:30, 15:30, 16:30, 18:30 UTC (CT EDGE, ET CONV+PT EDGE,
    # CT CONV+MT EDGE, MT CONV+PT CONV).
    # Tighter schedule also absorbs GitHub Actions cron drops on free tier.
    - cron: '0,10,20,30,40,50 14-21 * * *'
  workflow_dispatch:                  # allows manual trigger from GitHub UI

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run weather fetch
        env:
          WETHR_API_KEY: ${{ secrets.WETHR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python fetch_weather.py
